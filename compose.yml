services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soropulse
      POSTGRES_PASSWORD: soropulse
      POSTGRES_DB: soropulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soropulse -d soropulse"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["node", "dist/src/db/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://soropulse:soropulse@postgres:5432/soropulse
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    command: ["node", "dist/src/api/main.js"]
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://soropulse:soropulse@postgres:5432/soropulse
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
  ingest:
    build: .
    command: ["node", "dist/src/worker/ingest-main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://soropulse:soropulse@postgres:5432/soropulse
    depends_on:
      migrate:
        condition: service_completed_successfully
  deliver:
    build: .
    command: ["node", "dist/src/worker/deliver-main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://soropulse:soropulse@postgres:5432/soropulse
    depends_on:
      migrate:
        condition: service_completed_successfully
  consumer:
    build: .
    command: ["node", "dist/examples/ticket-consumer/main.js"]
    env_file: .env
    environment:
      CONSUMER_HOST: 0.0.0.0
      CONSUMER_DATABASE_URL: postgresql://consumer:consumer@postgres:5432/soropulse_consumer
      API_URL: http://api:3001
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  db_data:
