name: CI
on:
  push:
    branches: [main, feat/soropulse-backend-mvp]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soropulse
          POSTGRES_PASSWORD: soropulse
          POSTGRES_DB: soropulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soropulse -d soropulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://soropulse:soropulse@127.0.0.1:5432/soropulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm openapi:check
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
